---
- name: Find contract intent files
  ansible.builtin.find:
    paths: "{{ tenant_dir }}/contracts"
    patterns: "*.yml"
  register: contract_files
  delegate_to: localhost
  when: target_file | length == 0

- name: Set contract file list (scoped)
  ansible.builtin.set_fact:
    contract_files:
      files:
        - path: "{{ playbook_dir }}/../{{ target_file }}"
  when: target_file | length > 0 and scoped_type == 'contracts'

- name: Apply each contract
  ansible.builtin.include_tasks: _apply_contract.yml
  loop: "{{ contract_files.files | map(attribute='path') | list }}"
  loop_control:
    loop_var: contract_file
  when: contract_files.files | length > 0
