---
- name: Load EPG vars from file
  ansible.builtin.include_vars:
    file: "{{ epg_file }}"
    name: epg_data

# Derive the AP name from the file path:
# .../application_profiles/PROD-APP/epgs/WEB-EPG.yml → PROD-APP
- name: Derive AP name from path
  ansible.builtin.set_fact:
    epg_ap_name: "{{ epg_file | regex_search('application_profiles/([^/]+)/epgs/', '\\1') | first }}"

- name: Configure EPG - {{ epg_data.epg.name }}
  cisco.aci.aci_epg:
    host:           "{{ ansible_host }}"
    username:       "{{ ansible_user }}"
    password:       "{{ ansible_password }}"
    validate_certs: "{{ aci_validate_certs }}"
    output_level:   "{{ aci_output_level }}"
    tenant:         "{{ tenant.name }}"
    ap:             "{{ epg_ap_name }}"
    epg:            "{{ epg_data.epg.name }}"
    bd:             "{{ epg_data.epg.bd }}"
    description:    "{{ epg_data.epg.description | default(omit) }}"
    state:          "{{ force_state if force_state else epg_data.epg.state | default('present') }}"
