---
- name: Load contract vars from file
  ansible.builtin.include_vars:
    file: "{{ contract_file }}"
    name: contract_data

- name: Configure contract - {{ contract_data.contract.name }}
  cisco.aci.aci_contract:
    host:           "{{ ansible_host }}"
    username:       "{{ ansible_user }}"
    password:       "{{ ansible_password }}"
    validate_certs: "{{ aci_validate_certs }}"
    output_level:   "{{ aci_output_level }}"
    tenant:         "{{ tenant.name }}"
    contract:       "{{ contract_data.contract.name }}"
    scope:          "{{ contract_data.contract.scope | default('tenant') }}"
    description:    "{{ contract_data.contract.description | default(omit) }}"
    state:          "{{ force_state if force_state else contract_data.contract.state | default('present') }}"
